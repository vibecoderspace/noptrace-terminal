name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build + verify debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          echo "--- packaged native libraries ---"
          unzip -l "$APK" | grep 'lib/' || true

          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libtermux.so'
          if unzip -l "$APK" | grep -q 'libnoptrace.so'; then
            echo "error: standalone libnoptrace.so must not be packaged" >&2
            exit 1
          fi
          if unzip -l "$APK" | grep -qE 'libproot|libloader'; then
            echo "error: PRoot binaries must not be packaged" >&2
            exit 1
          fi

          mkdir -p /tmp/apk-libs
          unzip -o "$APK" 'lib/arm64-v8a/libtermux.so' -d /tmp/apk-libs > /dev/null

          NM="$(find "$ANDROID_HOME/ndk/28.2.13676358" -name llvm-nm | head -n 1)"
          "$NM" -D --defined-only /tmp/apk-libs/lib/arm64-v8a/libtermux.so > /tmp/nm.txt

          grep -q 'Java_com_termux_terminal_JNI_createSubprocessEngine' /tmp/nm.txt
          grep -q 'Java_com_termux_terminal_JNI_hasNoptrace' /tmp/nm.txt

          if grep -qE ' [TtWw] cng_' /tmp/nm.txt; then
            echo "error: noptrace internals must not be exported" >&2
            grep -E ' [TtWw] cng_' /tmp/nm.txt >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noptrace-terminal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Attach APK to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-debug-apk
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: noptrace-terminal-debug
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-debug.apk
          generate_release_notes: true
